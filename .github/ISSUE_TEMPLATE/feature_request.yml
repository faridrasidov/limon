name: Feature request
description: Suggest a new feature or an improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you are trying to do and why it is hard today.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to see?
      description: How it would look in the prompt or which `limon config` option you imagine.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
  - type: checkboxes
    id: constraints
    attributes:
      label: Limon's constraints
      description: Limon stays pure Bash and fast on every Enter.
      options:
        - label: This could work in pure Bash, without new runtime dependencies or patched fonts.
        - label: I'd be willing to open a pull request for this.
