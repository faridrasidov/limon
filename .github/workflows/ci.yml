name: CI

on:
  push:
    branches: [master, beta, dev]
  pull_request:
  workflow_dispatch:

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint shell sources
        run: shellcheck -S warning limon.sh install.sh hint-limon.sh get-limon.sh tests/*.sh

  test:
    name: tests (bash ${{ matrix.bash }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Limon's floor is bash 4.0 (it uses mapfile and ${var^^}). The 4.4 leg
        # is the oldest version still widely shipped; 5.2 is current.
        bash: ["4.4", "5.0", "5.2"]
    container: bash:${{ matrix.bash }}
    steps:
      - name: Install test dependencies
        # The bash:* images are Alpine-based and ship neither git nor coreutils.
        run: apk add --no-cache git grep coreutils

      - uses: actions/checkout@v4

      - name: Mark checkout as a safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run test suite
        run: bash tests/run.sh

  render-time:
    name: prompt render time
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Measure render time
        # Guards against order-of-magnitude regressions in the prompt hot path.
        # The threshold is deliberately loose so a shared runner cannot make it
        # flaky; it exists to catch a rewrite that reintroduces per-render forks
        # or per-render theme parsing, not to police small deltas.
        run: bash tests/bench_guard.sh
