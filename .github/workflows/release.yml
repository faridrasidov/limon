name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build a release for (e.g. v1.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # On workflow_dispatch the default ref is the branch, not the tag, so
          # build from whatever ref was actually asked for.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve version from the tag
        id: version
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${tag#v}"

          # A pre-release tag carries a suffix (v1.1.0-rc1). Artifacts use the
          # full version, but LIMON_VERSION and the changelog only ever name the
          # base version, so compare against that.
          base="${version%%-*}"
          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true

          {
            echo "tag=$tag"
            echo "version=$version"
            echo "base=$base"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

          echo "tag=$tag version=$version base=$base prerelease=$prerelease"

      - name: Check the tag matches LIMON_VERSION and the changelog
        env:
          TAG: ${{ steps.version.outputs.tag }}
          BASE: ${{ steps.version.outputs.base }}
        run: |
          set -euo pipefail

          declared="$(grep -m1 '^LIMON_VERSION=' limon.sh | cut -d'"' -f2)"
          if [[ "$declared" != "$BASE" ]]; then
            echo "::error::Tag $TAG implies version $BASE, but limon.sh declares LIMON_VERSION=$declared." >&2
            echo "Bump LIMON_VERSION, or tag the right commit." >&2
            exit 1
          fi

          if ! grep -qE "^## ${BASE//./\\.} " CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $BASE' section." >&2
            exit 1
          fi

          echo "Version $BASE checks out."

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint
        run: shellcheck -S warning limon.sh install.sh hint-limon.sh get-limon.sh tests/*.sh

      - name: Test
        # A release is never cut from a red tree.
        run: bash tests/run.sh

      - name: Build archives
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          stage="dist/limon-${VERSION}"
          mkdir -p "$stage"

          # Runtime payload only — no tests, no CI config, no screenshot.
          cp limon.sh hint-limon.sh install.sh get-limon.sh \
             README.md CHANGELOG.md LICENSE "$stage/"
          cp -r themes "$stage/themes"

          ( cd dist && tar -czf "limon-${VERSION}.tar.gz" "limon-${VERSION}" )
          ( cd dist && zip -qr "limon-${VERSION}.zip" "limon-${VERSION}" )
          ( cd dist && sha256sum "limon-${VERSION}.tar.gz" "limon-${VERSION}.zip" > SHA256SUMS )

          echo "Built:"
          ls -lh dist/*.tar.gz dist/*.zip dist/SHA256SUMS
          cat dist/SHA256SUMS

      - name: Verify the archive installs
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Unpack the archive exactly as a user would and install from it into
          # a throwaway HOME, so a broken payload fails the release rather than
          # reaching the Releases page.
          work="$(mktemp -d)"
          tar -xzf "dist/limon-${VERSION}.tar.gz" -C "$work"
          home="$(mktemp -d)"
          HOME="$home" XDG_DATA_HOME="$home/.local/share" \
            bash "$work/limon-${VERSION}/install.sh" --user -y
          test -f "$home/.local/share/limon/limon.sh"
          grep -q 'limon on' "$home/.bashrc"
          echo "Archive installs cleanly."

      - name: Extract the changelog section for this version
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BASE: ${{ steps.version.outputs.base }}
        run: |
          set -euo pipefail
          # Everything between this version's heading and the next one.
          awk -v ver="## ${BASE} " '
            index($0, ver) == 1 { found = 1; next }
            found && /^## [0-9]+\.[0-9]+\.[0-9]+/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          {
            echo
            echo "---"
            echo
            echo "### Install"
            echo
            echo '```shell'
            echo 'curl -fsSL https://raw.githubusercontent.com/faridrasidov/limon/master/get-limon.sh | bash'
            echo '```'
            echo
            echo "Or download an archive below and run \`bash limon-${VERSION}/install.sh\`."
            echo "Verify a download with \`sha256sum -c SHA256SUMS --ignore-missing\`."
          } >> release-notes.md

          cat release-notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          args=(
            "$TAG"
            --title "Limon $VERSION"
            --notes-file release-notes.md
          )
          [[ "$PRERELEASE" == "true" ]] && args+=(--prerelease)

          gh release create "${args[@]}" \
            "dist/limon-${VERSION}.tar.gz" \
            "dist/limon-${VERSION}.zip" \
            dist/SHA256SUMS
